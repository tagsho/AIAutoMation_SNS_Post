name: Threads Scheduled Publisher

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: threads-scheduled-publisher
  cancel-in-progress: false

jobs:
  publish-due-posts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Publish due Threads posts
        env:
          THREADS_FORTUNE_TOKEN: ${{ secrets.THREADS_FORTUNE_TOKEN }}
          THREADS_SIDE_HUSTLE_TOKEN: ${{ secrets.THREADS_SIDE_HUSTLE_TOKEN }}
        run: node scripts/publish_due_threads.mjs

      - name: Commit schedule updates
        run: |
          if git diff --quiet -- threads_schedule.json; then
            echo "No schedule changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add threads_schedule.json
          git commit -m "Update Threads schedule status"
          git push
